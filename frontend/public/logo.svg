<svg width="120" height="120" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Eye Contour Gradient -->
    <linearGradient id="ethixEyeGrad" x1="16" y1="20" x2="48" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f0abfc" />
      <stop offset="35%" stop-color="#c084fc" />
      <stop offset="75%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Lens Iris Radial Gradient -->
    <radialGradient id="ethixIrisGrad" cx="38%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#ff3b80" />
      <stop offset="30%" stop-color="#d946ef" />
      <stop offset="65%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#2e1065" />
    </radialGradient>

    <!-- Lens Glass Reflection Gradient -->
    <linearGradient id="ethixGlassGrad" x1="42" y1="30" x2="74" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Eye Shape Loop in Background -->
  <path
    d="M 18 52 C 19 28, 46 17, 68 24 C 54 36, 48 60, 39 71 C 27 75, 17 66, 18 52 Z"
    stroke="url(#ethixEyeGrad)"
    stroke-width="7.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Magnifying Glass Handle -->
  <line
    x1="74" y1="67"
    x2="90" y2="85"
    stroke="#161938"
    stroke-width="9.5"
    stroke-linecap="round"
  />
  <line
    x1="74" y1="67"
    x2="89" y2="84"
    stroke="#2e336b"
    stroke-width="5.5"
    stroke-linecap="round"
  />

  <!-- Lens Glass Body -->
  <circle cx="58" cy="46" r="23" fill="#0d1124" />
  <circle cx="58" cy="46" r="23" fill="url(#ethixGlassGrad)" />

  <!-- Iris / Glowing Eye inside Lens -->
  <circle cx="58" cy="46" r="14.5" fill="url(#ethixIrisGrad)" />

  <!-- Specular Reflection Highlight (White Dot) -->
  <circle cx="64" cy="40.5" r="3.2" fill="#ffffff" />

  <!-- Magnifying Glass Dark Navy Rim -->
  <circle
    cx="58"
    cy="46"
    r="23"
    stroke="#161938"
    stroke-width="8"
    fill="none"
  />
  <!-- Subtle Inner Rim Highlight -->
  <circle
    cx="58"
    cy="46"
    r="23"
    stroke="#6366f1"
    stroke-width="1.2"
    stroke-opacity="0.5"
    fill="none"
  />
</svg>
